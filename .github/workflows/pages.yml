name: Experiment site

# Publishes the static site of the expert evaluation (experiment/cases/ and the page that shows
# them) on GitHub Pages. In the repository settings, Pages must have "GitHub Actions" as source.
on:
  push:
    branches: [main]
    paths:
      - 'experiment/cases/**'
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:experiment
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-experiment

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
