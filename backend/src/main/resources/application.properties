spring.application.name=studio-backend
server.port=8080
# Folder holding the .ecore metamodels (source of truth for the domain).
studio.metamodels-dir=../metamodels
# Folder holding the runtime models, one sub-folder per workspace.
studio.workspace-dir=../workspace
spring.servlet.multipart.max-file-size=5MB
# Browsers send every cookie set on the host (localhost is shared by many dev apps).
server.max-http-request-header-size=64KB

# Exercise generation. "mock" always returns the same sample tune; "ollama" asks a local music model.
studio.generation.default-generator=mock
studio.generation.max-attempts=3
studio.ollama.base-url=http://localhost:11434
studio.ollama.model=hf.co/mradermacher/ChatMusician-GGUF:Q4_K_M
studio.ollama.timeout=120s
studio.ollama.temperature=0.2
# When true, a new attempt also tells the model which checks the previous exercise failed.
studio.ollama.feedback=false
